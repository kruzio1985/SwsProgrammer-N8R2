; ==============================================================================
; SWS Programmer - programator Telink TLSR825x (np. Tuya TS0201) na ESP32-S3
; Oparty na technice "SWS przez nadajnik UART" z projektu OpenEPaperLink
; oraz na floaderze pvvx (TlsrComProg825x) - patrz README.md (atrybucja).
; ==============================================================================

[env:esp32s3]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc1-n8r2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8

; Board esp32-s3-devkitc1-n8r2 = 8 MB flash QSPI + 2 MB PSRAM (quad).
; Board definiuje BOARD_HAS_PSRAM, więc ps_malloc / PSRAM działają od razu.

; --- Konsola na UART0 (GPIO43/44) -> konwerter CH343 -> COM11 ---
; NIE włączamy ARDUINO_USB_CDC_ON_BOOT - Serial ma iść na COM11,
; a nie na natywne USB. (Natywne USB zostaje wolne.)
build_flags =
    -DCORE_DEBUG_LEVEL=0

; ==============================================================================
; Ten sam programator na płytce ESP32-S3-DevKitC-1-N16R8
; (16 MB flash quad + 8 MB PSRAM octal). Piny identyczne jak wyżej -
; to ta sama obudowa DevKitC-1, tylko większy moduł.
; ==============================================================================

[env:esp32s3n16r8]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8

build_flags =
    -DCORE_DEBUG_LEVEL=0
